<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4eb">
  <meta name="description" content="Las recetas de Recetario Ortiz, para consultar y compartir.">
  <title>Recetario Ortiz</title>
  <link rel="icon" href="assets/apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Recetario Ortiz">
  <script>
    // Cada carga solicita los recursos de la versión actual a GitHub Pages.
    window.recetarioVersion = Date.now().toString();
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'styles.css?v=' + window.recetarioVersion;
    document.head.append(css);
    const app = document.createElement('script');
    app.src = 'app.js?v=' + window.recetarioVersion;
    document.addEventListener('DOMContentLoaded', () => document.body.append(app));
  </script>
</head>
<body>
  <a href="#contenido" class="skip-link">Saltar al contenido</a>
  <div class="shell">
    <header class="brand"><button class="menu-toggle" type="button" aria-label="Abrir categorías" aria-haspopup="dialog" aria-controls="category-menu"><span></span><span></span><span></span></button><a href="#" aria-label="Recetario Ortiz, inicio"><img src="assets/logo.png" alt="Recetario Ortiz" width="324" height="38"></a><span>Recetas para compartir</span></header>
    <dialog id="category-menu" class="category-menu" aria-labelledby="category-menu-title"><div class="category-menu-head"><h2 id="category-menu-title">Categorías</h2><button type="button" class="menu-close" aria-label="Cerrar menú">×</button></div><nav aria-label="Categorías de recetas"></nav></dialog>
    <main id="contenido" tabindex="-1"><p class="loading" role="status">Cargando recetas…</p></main>
  </div>
</body>
</html>
