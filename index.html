<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4eb">
  <meta name="description" content="Las recetas de Recetario Ortiz, para consultar y compartir.">
  <title>Recetario Ortiz</title>
  <link rel="icon" href="data:,">
  <script>
    // Cada carga solicita los recursos de la versión actual a GitHub Pages.
    window.recetarioVersion = Date.now().toString();
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'styles.css?v=' + window.recetarioVersion;
    document.head.append(css);
    const app = document.createElement('script');
    app.src = 'app.js?v=' + window.recetarioVersion;
    document.addEventListener('DOMContentLoaded', () => document.body.append(app));
  </script>
</head>
<body>
  <a href="#contenido" class="skip-link">Saltar al contenido</a>
  <div class="shell">
    <header class="brand"><a href="#" aria-label="Recetario Ortiz, inicio"><img src="assets/logo.png" alt="Recetario Ortiz" width="324" height="38"></a><span>Recetas para compartir</span></header>
    <main id="contenido" tabindex="-1"><p class="loading" role="status">Cargando recetas…</p></main>
  </div>
</body>
</html>
